name: CI

# Runs on every push to main: typecheck, production Next build + worker bundle,
# then a full Docker image build so a broken Dockerfile/dependency is caught
# before deployment.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`, so the client exists for typecheck.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Next.js production build
        run: npm run build

      - name: Worker bundle
        run: npm run build:worker

  docker:
    name: Docker image build
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the same multi-stage image docker compose uses. push: false —
      # this only proves the image builds (ffmpeg, yt-dlp, prisma, next build).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: repurpose-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
